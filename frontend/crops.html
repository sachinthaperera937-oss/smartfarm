<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartFarm | Crops</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/crops.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <span class="logo-icon">🌱</span>
            <span>SmartFarm</span>
        </div>

        <nav class="navigation">

            <a href="dashboard.html" class="nav-item">
                <span>▦</span>
                Dashboard
            </a>

            <a href="farms.html" class="nav-item">
                <span>⌂</span>
                Farms
            </a>

            <a href="crops.html" class="nav-item active">
                <span>🌾</span>
                Crops
            </a>

            <a href="weather.html" class="nav-item">
                <span>☀</span>
                Weather
            </a>

            <a href="recommendations.html" class="nav-item">
                <span>✦</span>
                AI Insights
            </a>

            <a href="reports.html" class="nav-item">
                <span>▤</span>
                Reports
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="settings.html" class="nav-item">
                <span>⚙</span>
                Settings
            </a>

            <a href="login.html" class="nav-item logout">
                <span>↪</span>
                Logout
            </a>

        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- HEADER -->
        <header class="topbar">

            <div>
                <h1>Crops</h1>
                <p>Track the growth and health of your crops.</p>
            </div>

            <div class="user-area">

                <button class="notification">
                    🔔
                </button>

                <div class="user">

                    <div class="avatar">
                        F
                    </div>

                    <div>
                        <strong>Farmer</strong>
                        <small>Farm Manager</small>
                    </div>

                </div>

            </div>

        </header>


        <!-- ACTION BAR -->
        <section class="crop-actions">

            <div class="filter-area">

                <div class="search-box">

                    <span>⌕</span>

                    <input
                        type="text"
                        id="cropSearch"
                        placeholder="Search crops..."
                    >

                </div>


                <!-- STATUS FILTER -->
                <select id="stageFilter">

                    <option value="all">
                        All Statuses
                    </option>

                    <option value="planned">
                        Planned
                    </option>

                    <option value="planted">
                        Planted
                    </option>

                    <option value="growing">
                        Growing
                    </option>

                    <option value="harvested">
                        Harvested
                    </option>

                </select>

            </div>


            <button
                class="add-crop-button"
                id="addCropButton"
                type="button"
            >
                + Add New Crop
            </button>

        </section>


        <!-- SUMMARY -->
        <section class="crop-summary">

            <!-- TOTAL CROPS -->
            <div class="summary-card">

                <div class="summary-icon">
                    🌾
                </div>

                <div>
                    <span>Total Crops</span>

                    <strong id="totalCrops">
                        0
                    </strong>
                </div>

            </div>


            <!-- GROWING CROPS -->
            <div class="summary-card">

                <div class="summary-icon">
                    🌱
                </div>

                <div>
                    <span>Growing</span>

                    <strong id="growingCrops">
                        0
                    </strong>
                </div>

            </div>


            <!-- FLOWERING CROPS -->
            <div class="summary-card">

                <div class="summary-icon">
                    🌸
                </div>

                <div>
                    <span>Planted</span>

                    <strong id="floweringCrops">
                        0
                    </strong>
                </div>

            </div>


            <!-- NEEDS ATTENTION -->
            <div class="summary-card">

                <div class="summary-icon alert">
                    ⚠
                </div>

                <div>
                    <span>Planned</span>

                    <strong id="attentionCrops">
                        0
                    </strong>
                </div>

            </div>

        </section>


        <!-- CROP CARDS -->
        <section
            class="crop-grid"
            id="cropGrid"
        >

            <p class="loading-message">
                Loading crops...
            </p>

        </section>

    </main>

</div>


<!-- ADD CROP MODAL -->
<div
    class="modal-overlay"
    id="cropModal"
>

    <div class="crop-modal">

        <!-- MODAL HEADER -->
        <div class="modal-header">

            <div>
                <h2>Add New Crop</h2>
                <p>Enter the details of your crop.</p>
            </div>

            <button
                type="button"
                class="close-modal"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <!-- CROP FORM -->
        <form id="cropForm">

            <div class="form-row">

                <!-- CROP -->
                <div class="form-group">

                    <label for="cropName">
                        Crop
                    </label>

                    <select
                        id="cropName"
                        required
                    >

                        <option value="">
                            Select crop
                        </option>

                        <option value="Tomato">
                            Tomato
                        </option>

                        <option value="Rice">
                            Rice
                        </option>

                        <option value="Carrot">
                            Carrot
                        </option>

                        <option value="Corn">
                            Corn
                        </option>

                        <option value="Potato">
                            Potato
                        </option>

                    </select>

                </div>


                <!-- FARM -->
                <div class="form-group">

                    <label for="cropFarm">
                        Farm
                    </label>

                    <select
                        id="cropFarm"
                        required
                    >

                        <option value="">
                            Loading farms...
                        </option>

                    </select>

                </div>

            </div>


            <!-- DATES -->
            <div class="form-row">

                <div class="form-group">

                    <label for="plantingDate">
                        Planting Date
                    </label>

                    <input
                        type="date"
                        id="plantingDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="harvestDate">
                        Expected Harvest
                    </label>

                    <input
                        type="date"
                        id="harvestDate"
                        required
                    >

                </div>

            </div>


            <!-- CROP STATUS -->
            <div class="form-group">

                <label for="growthStage">
                    Crop Status
                </label>

                <select
                    id="growthStage"
                    required
                >

                    <option value="">
                        Select status
                    </option>

                    <option value="planned">
                        Planned
                    </option>

                    <option value="planted">
                        Planted
                    </option>

                    <option value="growing">
                        Growing
                    </option>

                    <option value="harvested">
                        Harvested
                    </option>

                </select>

            </div>


            <!-- MODAL ACTIONS -->
            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancelModal"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-button"
                >
                    Save Crop
                </button>

            </div>

        </form>

    </div>

</div>


<!-- JAVASCRIPT -->
<script src="js/crops.js"></script>

</body>

</html>
